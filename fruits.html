<!DOCTYPE html>
<html>
<head>
  <title>BaskUp | Fruits</title>
  <link rel="stylesheet" href="../public/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark text-white">

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="navbar-brand text-white">⬅ Back to Home</a>
  </div>
</nav>

<div class="container mt-4">
  <h2>🍎 Fruits</h2>

  <div class="row">

    <!-- Apple -->
    <div class="col-md-3 mt-3">
      <div class="card product-card">
        <img src="/images/apple.jpg" class="card-img-top">
        <div class="card-body text-center">
          <h5>Apple</h5>
          <p>₹120</p>
          <button onclick="addToCart('Apple',120)" class="btn btn-primary">
            Add to Cart
          </button>
        </div>
      </div>
    </div>

    <!-- Banana -->
    <div class="col-md-3 mt-3">
      <div class="card product-card">
        <img src="/images/banana.jpg" class="card-img-top">
        <div class="card-body text-center">
          <h5>Banana</h5>
          <p>₹60</p>
          <button onclick="addToCart('Banana',60)" class="btn btn-primary">
            Add to Cart
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="../public/js/app.js"></script>
</body>
</html>
